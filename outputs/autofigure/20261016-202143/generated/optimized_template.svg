<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 720" width="1456" height="720">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 20px; font-weight: bold; fill: #1A3B5C; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: bold; fill: #000000; }
      .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: bold; fill: #000000; }
      .annot-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: bold; fill: #000000; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 18px; font-weight: bold; fill: #000000; }
      .tick-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: bold; fill: #000000; }
      .placeholder-text { font-family: monospace, sans-serif; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1456" height="720" fill="#FFFFFF"/>

  <!-- Top Titles -->
  <text class="title-text" x="259" y="88" text-anchor="middle">可靠 TUN 虚拟接口</text>
  <text class="title-text" x="818" y="88" text-anchor="middle">出端传输队列</text>
  <text class="title-text" x="1277" y="88" text-anchor="middle">可靠无线传输</text>

  <!-- TUN Placeholder (AF03) -->
  <g id="AF03">
    <rect x="212" y="110" width="94" height="91" fill="#808080" stroke="black" stroke-width="2"/>
    <text class="placeholder-text" x="259" y="155" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="14">&lt;AF&gt;03</text>
  </g>

  <!-- Data Flow Arrow 1 & Gate Control -->
  <line x1="306" y1="155" x2="442" y2="155" stroke="#2E6B9E" stroke-width="3"/>
  <text class="title-text" x="450" y="125" text-anchor="middle" font-size="18">数据</text>
  <!-- Gate symbol -->
  <line x1="447" y1="136" x2="447" y2="174" stroke="#000000" stroke-width="3"/>
  <line x1="453" y1="136" x2="453" y2="174" stroke="#000000" stroke-width="3"/>
  <text class="label-text" x="450" y="202" text-anchor="middle">读入控制</text>
  <line x1="458" y1="155" x2="575" y2="155" stroke="#2E6B9E" stroke-width="3"/>
  <polygon points="575,145 600,155 575,165" fill="#2E6B9E"/>

  <!-- Queue Container Structure -->
  <path d="M 1028,110 L 608,110 L 608,201 L 1028,201" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="668" y1="110" x2="668" y2="201" stroke="#000000" stroke-width="2"/>
  <line x1="728" y1="110" x2="728" y2="201" stroke="#000000" stroke-width="2"/>
  <line x1="788" y1="110" x2="788" y2="201" stroke="#000000" stroke-width="2"/>
  <line x1="848" y1="110" x2="848" y2="201" stroke="#000000" stroke-width="2"/>

  <!-- Empty queue slots (rounded rectangles) -->
  <rect x="856" y="122" width="40" height="67" rx="4" fill="#F4F7FB" stroke="#8A9BA8" stroke-width="1.5"/>
  <rect x="904" y="122" width="40" height="67" rx="4" fill="#F4F7FB" stroke="#8A9BA8" stroke-width="1.5"/>
  <rect x="952" y="122" width="40" height="67" rx="4" fill="#F4F7FB" stroke="#8A9BA8" stroke-width="1.5"/>
  <text x="1015" y="155" fill="#8A9BA8" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle">···</text>

  <!-- Queue Item Placeholders (AF07, AF05, AF04, AF06) -->
  <g id="AF07">
    <rect x="618" y="122" width="46" height="67" fill="#808080" stroke="black" stroke-width="2"/>
    <text class="placeholder-text" x="641" y="155" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="11">&lt;AF&gt;07</text>
  </g>
  <g id="AF05">
    <rect x="677" y="122" width="46" height="67" fill="#808080" stroke="black" stroke-width="2"/>
    <text class="placeholder-text" x="700" y="155" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="11">&lt;AF&gt;05</text>
  </g>
  <g id="AF04">
    <rect x="737" y="122" width="46" height="67" fill="#808080" stroke="black" stroke-width="2"/>
    <text class="placeholder-text" x="760" y="155" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="11">&lt;AF&gt;04</text>
  </g>
  <g id="AF06">
    <rect x="797" y="122" width="46" height="67" fill="#808080" stroke="black" stroke-width="2"/>
    <text class="placeholder-text" x="820" y="155" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="11">&lt;AF&gt;06</text>
  </g>

  <!-- Output Arrow to Wireless Transmitter -->
  <line x1="1042" y1="155" x2="1200" y2="155" stroke="#2E6B9E" stroke-width="3"/>
  <polygon points="1195,145 1220,155 1195,165" fill="#2E6B9E"/>

  <!-- Wireless Placeholders (AF01 partially overlapped by AF02) -->
  <g id="AF01">
    <rect x="1255" y="110" width="70" height="42" fill="#808080" stroke="black" stroke-width="2"/>
    <text class="placeholder-text" x="1290" y="131" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="14">&lt;AF&gt;01</text>
  </g>
  <g id="AF02">
    <rect x="1245" y="110" width="65" height="95" fill="#808080" stroke="black" stroke-width="2"/>
    <text class="placeholder-text" x="1277" y="157" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="14">&lt;AF&gt;02</text>
  </g>

  <!-- Feedback Control Loops -->
  <path d="M 1120,155 L 1120,290 L 435,290 L 435,225" fill="none" stroke="#5B6E82" stroke-width="2"/>
  <polygon points="430,225 435,213 440,225" fill="#5B6E82"/>

  <path d="M 1120,250 L 478,250 L 478,225" fill="none" stroke="#5B6E82" stroke-width="2"/>
  <polygon points="473,225 478,213 483,225" fill="#5B6E82"/>

  <!-- Upper Feedback Text & Triangle Indicator -->
  <rect x="560" y="235" width="370" height="30" fill="#FFFFFF"/>
  <polygon points="575,242 560,250 575,258" fill="#E67E22"/>
  <text class="status-text" x="582" y="255">队列水位高, 暂停TUN读读入</text>

  <!-- Lower Feedback Text & Triangle Indicator -->
  <rect x="560" y="275" width="370" height="30" fill="#FFFFFF"/>
  <polygon points="575,282 560,290 575,298" fill="#1ABC9C"/>
  <text class="status-text" x="582" y="295">队列水位低, 灰复TUN读读入</text>

  <!-- ==================== Bottom Graph ==================== -->
  <!-- Shaded Region under High Watermark -->
  <rect x="212" y="410" width="1143" height="190" fill="#E9EFF5"/>

  <!-- Y-Axis Vertical Line & Arrow -->
  <line x1="212" y1="600" x2="212" y2="345" stroke="#000000" stroke-width="2"/>
  <polygon points="207,355 212,335 217,355" fill="#000000"/>
  <text class="axis-label" x="-475" y="60" transform="rotate(-90)" text-anchor="middle">队列积压 (字节)</text>

  <!-- Watermark Lines and Labels -->
  <text class="tick-label" x="195" y="415" text-anchor="end">高水位 H</text>
  <line x1="212" y1="410" x2="1355" y2="410" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="8,6"/>

  <text class="tick-label" x="195" y="530" text-anchor="end">低水位 L</text>
  <line x1="212" y1="525" x2="1355" y2="525" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Curve Annotations -->
  <text class="annot-text" x="225" y="465">保持此前读入状态</text>
  <text class="annot-text" x="805" y="445">保持暂停读入</text>

  <!-- Queue Accumulation Curve -->
  <path d="M 212 560 C 280 560 350 550 410 525 C 470 500 530 410 587 410 C 660 410 760 445 860 480 C 940 510 1000 525 1048 525 C 1110 525 1190 495 1255 460 C 1295 440 1330 430 1355 430" fill="none" stroke="#2B6CB0" stroke-width="3.5"/>

  <!-- Dashed drop line from Point A -->
  <line x1="587" y1="410" x2="587" y2="652" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Point A (Peak) -->
  <circle cx="587" cy="410" r="7" fill="#E67E22"/>
  <text class="annot-text" x="578" y="380" fill="#E67E22" font-size="18">A</text>
  <text class="annot-text" x="600" y="380">达到高水位，暂停读入</text>

  <!-- Point B (Trough) -->
  <circle cx="1048" cy="525" r="7" fill="#1ABC9C"/>
  <text class="annot-text" x="1038" y="565" fill="#1ABC9C" font-size="18">B</text>
  <text class="annot-text" x="1060" y="565">降至低水位，恢复读入</text>

  <!-- X-Axis Line & Arrow -->
  <line x1="212" y1="600" x2="1395" y2="600" stroke="#000000" stroke-width="2"/>
  <polygon points="1385,595 1405,600 1385,605" fill="#000000"/>
  <text class="axis-label" x="1425" y="605">时间</text>

  <!-- Timeline Bar & States -->
  <text class="label-text" x="115" y="635" text-anchor="middle" font-size="18">TUN读入状态</text>

  <rect x="212" y="607" width="375" height="45" fill="#C8DBEE"/>
  <text class="label-text" x="399" y="635" text-anchor="middle" font-size="18">允许读入</text>

  <rect x="587" y="607" width="461" height="45" fill="#FEE5D0"/>
  <text class="label-text" x="817" y="635" text-anchor="middle" font-size="18">暂停读入</text>

  <rect x="1048" y="607" width="307" height="45" fill="#CEEFE8"/>
  <text class="label-text" x="1201" y="635" text-anchor="middle" font-size="18">允许读入</text>

  <!-- Separator on Timeline at Point B -->
  <line x1="1048" y1="607" x2="1048" y2="652" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom Caption -->
  <text class="label-text" x="728" y="692" text-anchor="middle" font-size="16">机制示意；高、低水位为固定预设阈值</text>
</svg>
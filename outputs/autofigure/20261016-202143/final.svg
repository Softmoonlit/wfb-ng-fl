<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 720" width="1456" height="720" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">出站队列水位与 TUN 反压机制</title><desc id="figure-description">队列积压达到固定高水位 H 时暂停 TUN 读入，已有数据仍可发送；降至固定低水位 L 后恢复读入。两个阈值之间保持此前读入状态。曲线为机制示意，无实测数据。</desc><defs>
    <style>
text { font-family: "Noto Sans CJK SC", sans-serif; fill: #1A365D; }
.title-text { font-size: 26px; font-weight: 500; }
.label-text, .status-text, .annot-text, .tick-label { font-size: 24px; font-weight: 400; }
.axis-label { font-size: 25px; font-weight: 400; }
</style>
  </defs>

  <!-- Background -->
  <line x1="1048" y1="537" x2="1048" y2="652" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="6,4"/><rect width="1456" height="720" fill="#FFFFFF"/>

  <!-- Top Titles -->
  <text class="title-text" x="259" y="88" text-anchor="middle">TUN 虚拟接口</text>
  <text class="title-text" x="818" y="88" text-anchor="middle">出站发送队列</text>
  <text class="title-text" x="1277" y="88" text-anchor="middle">无线发送</text>

  <!-- TUN Placeholder (AF03) -->
  <g id="tun-interface"><rect x="212.0" y="110.0" width="94.0" height="91.0" rx="7" fill="#EDF3FA" stroke="#1A365D" stroke-width="2.5"/><line x1="212.0" y1="133.0" x2="306.0" y2="133.0" stroke="#1A365D" stroke-width="2"/><circle cx="225.0" cy="122.0" r="3" fill="#718096"/><circle cx="237.0" cy="122.0" r="3" fill="#718096"/><circle cx="249.0" cy="122.0" r="3" fill="#718096"/><path d="M 235.0 153.0 H 283.0 M 259.0 153.0 V 176.0 M 235.0 153.0 V 176.0 M 283.0 153.0 V 176.0" fill="none" stroke="#2B6CB0" stroke-width="2.5"/><rect x="230.0" y="174.0" width="10" height="10" fill="white" stroke="#2B6CB0" stroke-width="2"/><rect x="254.0" y="174.0" width="10" height="10" fill="white" stroke="#2B6CB0" stroke-width="2"/><rect x="278.0" y="174.0" width="10" height="10" fill="white" stroke="#2B6CB0" stroke-width="2"/></g><!-- Data Flow Arrow 1 & Gate Control -->
  <line x1="306" y1="155" x2="442" y2="155" stroke="#2E6B9E" stroke-width="3"/>
  <text class="title-text" x="450" y="125" text-anchor="middle">数据</text>
  <!-- Gate symbol -->
  <line x1="447" y1="136" x2="447" y2="174" stroke="#000000" stroke-width="3"/>
  <line x1="453" y1="136" x2="453" y2="174" stroke="#000000" stroke-width="3"/>
  <text class="label-text" x="450" y="202" text-anchor="middle">读入控制</text>
  <line x1="458" y1="155" x2="575" y2="155" stroke="#2E6B9E" stroke-width="3"/>
  <polygon points="575,145 600,155 575,165" fill="#2E6B9E"/>

  <!-- Queue Container Structure -->
  <path d="M 1028,110 L 608,110 L 608,201 L 1028,201" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="668" y1="110" x2="668" y2="201" stroke="#000000" stroke-width="2"/>
  <line x1="728" y1="110" x2="728" y2="201" stroke="#000000" stroke-width="2"/>
  <line x1="788" y1="110" x2="788" y2="201" stroke="#000000" stroke-width="2"/>
  <line x1="848" y1="110" x2="848" y2="201" stroke="#000000" stroke-width="2"/>

  <!-- Empty queue slots (rounded rectangles) -->
  <rect x="856" y="122" width="40" height="67" rx="4" fill="#F4F7FB" stroke="#8A9BA8" stroke-width="1.5"/>
  <rect x="904" y="122" width="40" height="67" rx="4" fill="#F4F7FB" stroke="#8A9BA8" stroke-width="1.5"/>
  <rect x="952" y="122" width="40" height="67" rx="4" fill="#F4F7FB" stroke="#8A9BA8" stroke-width="1.5"/>
  <text x="1015" y="155" fill="#8A9BA8" font-weight="bold" text-anchor="middle" dominant-baseline="middle">···</text>

  <!-- Queue Item Placeholders (AF07, AF05, AF04, AF06) -->
  <g id="queue-payload-07"><rect x="621.0" y="127.0" width="40.0" height="57.0" rx="3" fill="#C8DBEE" stroke="#1A365D" stroke-width="2"/><line x1="629.0" y1="145.0" x2="653.0" y2="145.0" stroke="#2B6CB0" stroke-width="2"/><line x1="629.0" y1="156.0" x2="653.0" y2="156.0" stroke="#2B6CB0" stroke-width="2"/><line x1="629.0" y1="167.0" x2="653.0" y2="167.0" stroke="#2B6CB0" stroke-width="2"/></g><g id="queue-payload-05"><rect x="680.0" y="127.0" width="40.0" height="57.0" rx="3" fill="#C8DBEE" stroke="#1A365D" stroke-width="2"/><line x1="688.0" y1="145.0" x2="712.0" y2="145.0" stroke="#2B6CB0" stroke-width="2"/><line x1="688.0" y1="156.0" x2="712.0" y2="156.0" stroke="#2B6CB0" stroke-width="2"/><line x1="688.0" y1="167.0" x2="712.0" y2="167.0" stroke="#2B6CB0" stroke-width="2"/></g><g id="queue-payload-04"><rect x="740.0" y="127.0" width="40.0" height="57.0" rx="3" fill="#C8DBEE" stroke="#1A365D" stroke-width="2"/><line x1="748.0" y1="145.0" x2="772.0" y2="145.0" stroke="#2B6CB0" stroke-width="2"/><line x1="748.0" y1="156.0" x2="772.0" y2="156.0" stroke="#2B6CB0" stroke-width="2"/><line x1="748.0" y1="167.0" x2="772.0" y2="167.0" stroke="#2B6CB0" stroke-width="2"/></g><g id="queue-payload-06"><rect x="800.0" y="127.0" width="40.0" height="57.0" rx="3" fill="#C8DBEE" stroke="#1A365D" stroke-width="2"/><line x1="808.0" y1="145.0" x2="832.0" y2="145.0" stroke="#2B6CB0" stroke-width="2"/><line x1="808.0" y1="156.0" x2="832.0" y2="156.0" stroke="#2B6CB0" stroke-width="2"/><line x1="808.0" y1="167.0" x2="832.0" y2="167.0" stroke="#2B6CB0" stroke-width="2"/></g><!-- Output Arrow to Wireless Transmitter -->
  <line x1="1042" y1="155" x2="1200" y2="155" stroke="#2E6B9E" stroke-width="3"/>
  <polygon points="1195,145 1220,155 1195,165" fill="#2E6B9E"/>

  <!-- Wireless Placeholders (AF01 partially overlapped by AF02) -->
  <!-- Feedback Control Loops -->
  <path d="M 1008,201 L 1008,290 L 435,290 L 435,225" fill="none" stroke="#5B6E82" stroke-width="2"/>
  <polygon points="430,225 435,213 440,225" fill="#5B6E82"/>

  <path d="M 1008,250 L 478,250 L 478,225" fill="none" stroke="#5B6E82" stroke-width="2"/>
  <polygon points="473,225 478,213 483,225" fill="#5B6E82"/>

  <!-- Upper Feedback Text & Triangle Indicator -->
  <rect x="560" y="235" width="370" height="30" fill="#FFFFFF"/>
  <polygon points="575,242 560,250 575,258" fill="#E67E22"/>
  <text class="status-text" x="582" y="255">达到高水位：暂停读入</text>

  <!-- Lower Feedback Text & Triangle Indicator -->
  <rect x="560" y="275" width="370" height="30" fill="#FFFFFF"/>
  <polygon points="575,282 560,290 575,298" fill="#1ABC9C"/>
  <text class="status-text" x="582" y="295">降至低水位：恢复读入</text>

  <!-- ==================== Bottom Graph ==================== -->
  <!-- Shaded Region under High Watermark -->
  <rect x="212" y="410" width="1143" height="115" fill="#E9EFF5"/>

  <!-- Y-Axis Vertical Line & Arrow -->
  <line x1="212" y1="600" x2="212" y2="345" stroke="#000000" stroke-width="2"/>
  <polygon points="207,355 212,335 217,355" fill="#000000"/>
  <text class="axis-label" x="-475" y="60" transform="rotate(-90)" text-anchor="middle">队列积压（字节）</text>

  <!-- Watermark Lines and Labels -->
  <text class="tick-label" x="195" y="415" text-anchor="end">高水位 H</text>
  <line x1="212" y1="410" x2="1355" y2="410" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="8,6"/>

  <text class="tick-label" x="195" y="530" text-anchor="end">低水位 L</text>
  <line x1="212" y1="525" x2="1355" y2="525" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Curve Annotations -->
  <text class="annot-text" x="225" y="465">保持此前读入状态</text>
  <text class="annot-text" x="805" y="445">保持暂停读入</text>

  <!-- Queue Accumulation Curve -->
  <path d="M 212 560 C 280 560 350 550 410 525 C 470 500 530 410 587 410 C 660 410 760 445 860 480 C 940 510 1000 525 1048 525 C 1110 525 1190 495 1255 460 C 1295 440 1330 430 1355 430" fill="none" stroke="#2B6CB0" stroke-width="3.5"/>

  <!-- Dashed drop line from Point A -->
  <line x1="587" y1="410" x2="587" y2="652" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Point A (Peak) -->
  <circle cx="587" cy="410" r="7" fill="#E67E22"/>
  <text class="annot-text" x="578" y="380" fill="#E67E22" style="fill: #E67E22; font-size: 28px; font-weight: 500">A</text>
  <text class="annot-text" x="600" y="380">达到高水位，暂停读入</text>

  <!-- Point B (Trough) -->
  <circle cx="1048" cy="525" r="7" fill="#1ABC9C"/>
  <text class="annot-text" x="1038" y="565" fill="#1ABC9C" style="fill: #159D89; font-size: 28px; font-weight: 500">B</text>
  <text class="annot-text" x="1060" y="565">降至低水位，恢复读入</text>

  <!-- X-Axis Line & Arrow -->
  <line x1="212" y1="600" x2="1395" y2="600" stroke="#000000" stroke-width="2"/>
  <polygon points="1385,595 1405,600 1385,605" fill="#000000"/>
  <text class="axis-label" x="1394" y="640">时间</text>

  <!-- Timeline Bar & States -->
  <text class="label-text" x="112" y="635" text-anchor="middle">TUN 读入状态</text>

  <rect x="212" y="607" width="375" height="45" fill="#C8DBEE"/>
  <text class="label-text" x="399" y="635" text-anchor="middle">允许读入</text>

  <rect x="587" y="607" width="461" height="45" fill="#FEE5D0"/>
  <text class="label-text" x="817" y="635" text-anchor="middle">暂停读入</text>

  <rect x="1048" y="607" width="307" height="45" fill="#CEEFE8"/>
  <text class="label-text" x="1201" y="635" text-anchor="middle">允许读入</text>

  <!-- Separator on Timeline at Point B -->
  <line x1="1048" y1="607" x2="1048" y2="652" stroke="#7B8D9E" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom Caption -->
  <text class="label-text" x="728" y="692" text-anchor="middle" style="font-size: 21px; fill: #52657A">机制示意；高、低水位为固定预设阈值</text>
<g id="wireless-transmitter" fill="none" stroke="#1A365D" stroke-width="3"><circle cx="1280" cy="139" r="8" fill="#C8DBEE"/><path d="M 1274 151 L 1260 197 H 1300 L 1286 151 Z" fill="#C8DBEE"/><path d="M 1260 121 Q 1240 139 1260 157 M 1250 110 Q 1218 139 1250 168 M 1300 121 Q 1320 139 1300 157 M 1310 110 Q 1342 139 1310 168" stroke-linecap="round"/></g></svg>

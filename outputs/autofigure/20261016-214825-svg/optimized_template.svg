<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 720" width="1456" height="720">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1456" height="720" fill="#FFFFFF" />

  <!-- Left Protocol Stack Card -->
  <g id="protocol-card">
    <rect x="50" y="48" width="378" height="326" rx="14" fill="#FFFFFF" filter="url(#card-shadow)" />
    
    <!-- Layer 1 -->
    <rect x="70" y="66" width="244" height="52" fill="#A0D8DF" />
    <text x="192" y="99" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="22" fill="#111111">联邦学习算法层</text>

    <!-- Layer 2 -->
    <rect x="70" y="124" width="244" height="52" fill="#A0D8DF" />
    <text x="192" y="157" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="22" fill="#111111">联邦学习运行层</text>

    <!-- Layer 3 -->
    <rect x="70" y="182" width="244" height="52" fill="#F9CAB0" />
    <text x="192" y="215" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="22" fill="#111111">传输适配层</text>

    <!-- TUN Boundary -->
    <line x1="70" y1="240" x2="314" y2="240" stroke="#444444" stroke-width="2" stroke-dasharray="6,4" />
    <text x="326" y="241" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#111111">TUN 边界</text>

    <!-- Layer 4 -->
    <rect x="70" y="246" width="244" height="52" fill="#A0D8DF" />
    <text x="192" y="279" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="22" fill="#111111">链路控制层</text>

    <!-- Layer 5 -->
    <rect x="70" y="304" width="244" height="52" fill="#A0D8DF" />
    <text x="192" y="337" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="22" fill="#111111">无线收发层</text>
  </g>

  <!-- Server Title -->
  <text x="550" y="200" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="34" fill="#111111">服务端</text>

  <!-- Shadow below server base -->
  <ellipse cx="550" cy="492" rx="116" ry="7" fill="#D3E8EF" />

  <!-- Server Placeholder AF05 -->
  <g id="AF05">
    <rect x="443" y="240" width="213" height="248" fill="#808080" stroke="black" stroke-width="2" />
    <text x="549.5" y="364" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="36">&lt;AF&gt;05</text>
  </g>

  <!-- Top Blue Arrow & Label -->
  <text x="875" y="195" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="26" fill="#111111">模型广播 · UFTP</text>
  <path d="M 694 227 L 1018 227 L 1018 210 L 1060 241 L 1018 272 L 1018 255 L 694 255 Z" fill="#5294C6" stroke="#234563" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Middle Wi-Fi Placeholder AF01 & 802.11 Link Label -->
  <g id="AF01">
    <rect x="854" y="315" width="52" height="43" fill="#808080" stroke="black" stroke-width="2" />
    <text x="880" y="336.5" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="11">&lt;AF&gt;01</text>
  </g>
  <text x="880" y="396" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="26" fill="#111111">802.11 无线链路</text>

  <!-- Bottom Orange Arrow & Label -->
  <path d="M 1064 463 L 740 463 L 740 446 L 698 477 L 740 508 L 740 491 L 1064 491 Z" fill="#F49547" stroke="#773E1B" stroke-width="2.5" stroke-linejoin="round" />
  <text x="875" y="552" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="26" fill="#111111">更新回传 · HTTP PUT / TCP</text>

  <!-- Multiple Clients Title -->
  <text x="1220" y="105" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="34" fill="#111111">多个客户端</text>

  <!-- Client 1 Placeholder AF04 (Top) -->
  <g id="AF04">
    <rect x="1112" y="141" width="141" height="150" fill="#808080" stroke="black" stroke-width="2" />
    <text x="1182.5" y="216" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="26">&lt;AF&gt;04</text>
  </g>

  <!-- Three Dots -->
  <text x="1182.5" y="372" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="44" fill="#111111" letter-spacing="4">···</text>

  <!-- Client 2 Placeholder AF02 (Middle Right) -->
  <g id="AF02">
    <rect x="1260" y="280" width="141" height="150" fill="#808080" stroke="black" stroke-width="2" />
    <text x="1330.5" y="355" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="26">&lt;AF&gt;02</text>
  </g>

  <!-- Client 3 Placeholder AF03 (Bottom) -->
  <g id="AF03">
    <rect x="1112" y="441" width="141" height="150" fill="#808080" stroke="black" stroke-width="2" />
    <text x="1182.5" y="516" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="26">&lt;AF&gt;03</text>
  </g>
</svg>
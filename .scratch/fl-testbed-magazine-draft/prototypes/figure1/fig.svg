<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="230pt" viewBox="0 0 504 230" font-family="'Noto Sans CJK SC', 'WenQuanYi Zen Hei', 'Helvetica Neue', Arial, sans-serif">
<defs>
<marker id="arr-blue" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
  <path d="M0 0.5 L6 3 L0 5.5 Z" fill="#2b6cb0"/>
</marker>
<marker id="arr-navy" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
  <path d="M0 0.5 L6 3 L0 5.5 Z" fill="#1a365d"/>
</marker>
<marker id="arr-gray" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
  <path d="M0 0.5 L6 3 L0 5.5 Z" fill="#718096"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- 左上角微架构栈 -->
<g id="micro-arch-stack">
  <rect x="12" y="10" width="94" height="88" rx="2.5" fill="#edf3fa" stroke="#cbd5e0" stroke-width="0.7"/>
  <text x="59" y="21" font-size="6.8" font-weight="bold" fill="#1a365d" text-anchor="middle">WFB-FL 协同栈</text>
  
  <!-- 1. 算法层 -->
  <rect x="16" y="26" width="86" height="10" rx="1.2" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.5"/>
  <text x="59" y="33.5" font-size="5.2" font-weight="bold" fill="#2d3748" text-anchor="middle">FL Algorithm Layer</text>
  
  <!-- 2. 运行层 -->
  <rect x="16" y="38" width="86" height="10" rx="1.2" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.5"/>
  <text x="59" y="45.5" font-size="5.2" font-weight="bold" fill="#2d3748" text-anchor="middle">FL Runtime Layer</text>

  <!-- 3. 传输适配层 -->
  <rect x="16" y="50" width="86" height="10" rx="1.2" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="0.6"/>
  <text x="59" y="57.5" font-size="5.2" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Transport (UFTP / TCP)</text>

  <!-- TUN 边界虚线 -->
  <line x1="16" y1="62.5" x2="102" y2="62.5" stroke="#718096" stroke-width="0.6" stroke-dasharray="2.5,1.5"/>
  <rect x="37" y="60" width="44" height="5.5" rx="1" fill="#ffffff" stroke="#718096" stroke-width="0.4"/>
  <text x="59" y="64.2" font-size="4.2" font-weight="bold" fill="#4a5568" text-anchor="middle">TUN 边界 (数据面)</text>

  <!-- 4. 链路控制层 -->
  <rect x="16" y="66" width="86" height="10" rx="1.2" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.5"/>
  <text x="59" y="73.5" font-size="5.2" font-weight="bold" fill="#2d3748" text-anchor="middle">Link Control (队列/调度)</text>

  <!-- 5. 无线收发层 -->
  <rect x="16" y="78" width="86" height="10" rx="1.2" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.5"/>
  <text x="59" y="85.5" font-size="5.2" font-weight="bold" fill="#2d3748" text-anchor="middle">Radio (帧注入 / Monitor)</text>

  <!-- 调度控制旁路短弯弧 -->
  <path d="M 102 71 C 108 71 108 83 103 83" fill="none" stroke="#718096" stroke-width="0.6" stroke-dasharray="1.5,1" marker-end="url(#arr-gray)"/>
</g>
<!-- 微栈引申短弧 -->
<g id="callout-connector">
  <path d="M 106 55 C 122 55 130 80 135 108" fill="none" stroke="#cbd5e0" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>
  <text x="122" y="80" font-size="5.0" fill="#718096" text-anchor="middle">全栈引申</text>
</g>
<!-- 参数服务端 -->
<g id="server-node">
  <!-- 机柜外壳 -->
  <rect x="116" y="116" width="42" height="60" rx="2.5" fill="#edf3fa" stroke="#1a365d" stroke-width="0.9"/>
  <!-- 机架顶部天线 -->
  <line x1="137" y1="116" x2="137" y2="105" stroke="#1a365d" stroke-width="0.9"/>
  <circle cx="137" cy="105" r="1.4" fill="#1a365d"/>
  
  <!-- 刀片单元 1 -->
  <rect x="120" y="121" width="34" height="10" rx="1" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
  <circle cx="124" cy="126" r="1" fill="#2b6cb0"/>
  <circle cx="128" cy="126" r="1" fill="#38a169"/>
  <line x1="133" y1="126" x2="150" y2="126" stroke="#cbd5e0" stroke-width="0.6" stroke-dasharray="2,1"/>
  
  <!-- 刀片单元 2 -->
  <rect x="120" y="134" width="34" height="10" rx="1" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
  <circle cx="124" cy="139" r="1" fill="#2b6cb0"/>
  <circle cx="128" cy="139" r="1" fill="#38a169"/>
  <line x1="133" y1="139" x2="150" y2="139" stroke="#cbd5e0" stroke-width="0.6" stroke-dasharray="2,1"/>

  <!-- 刀片单元 3 -->
  <rect x="120" y="147" width="34" height="10" rx="1" fill="#ffffff" stroke="#cbd5e0" stroke-width="0.6"/>
  <circle cx="124" cy="152" r="1" fill="#2b6cb0"/>
  <circle cx="128" cy="152" r="1" fill="#38a169"/>
  <line x1="133" y1="152" x2="150" y2="152" stroke="#cbd5e0" stroke-width="0.6" stroke-dasharray="2,1"/>

  <!-- 底部通风网格 -->
  <line x1="122" y1="164" x2="152" y2="164" stroke="#cbd5e0" stroke-width="0.8"/>
  <line x1="122" y1="168" x2="152" y2="168" stroke="#cbd5e0" stroke-width="0.8"/>

  <text x="137" y="185" font-size="6.5" font-weight="bold" fill="#1a365d" text-anchor="middle">参数服务端 (Server)</text>
</g>
<!-- 步骤 ① 准备模型 -->
<g id="step-1">
  <circle cx="98" cy="138" r="4.2" fill="#1a365d"/>
  <text x="98" y="140.2" font-size="5.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="149" font-size="5.5" font-weight="bold" fill="#2d3748" text-anchor="middle">① 准备模型</text>
  <path d="M 98 132 C 98 122 108 122 115 124" fill="none" stroke="#718096" stroke-width="0.7" marker-end="url(#arr-gray)"/>
</g>
<!-- 步骤 ⑥ 收齐并聚合 -->
<g id="step-6">
  <!-- 向下平滑短弯弧 -->
  <path d="M 137 188 C 137 198 128 205 116 205" fill="none" stroke="#2b6cb0" stroke-width="1.1" marker-end="url(#arr-blue)"/>
  
  <rect x="36" y="196" width="76" height="16" rx="2" fill="#edf3fa" stroke="#2b6cb0" stroke-width="0.7"/>
  <circle cx="45" cy="204" r="3.8" fill="#1a365d"/>
  <text x="45" y="206.2" font-size="5.2" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="79" y="206.5" font-size="5.6" font-weight="bold" fill="#1a365d" text-anchor="middle">⑥ 收齐更新并聚合</text>
</g>
<!-- 客户端节点 Client 1 -->
<g id="node-client1">
  <rect x="444" y="25" width="28" height="18" rx="1.5" fill="#f7fafc" stroke="#1a365d" stroke-width="0.8"/>
  <!-- 芯片与金手指接口 -->
  <rect x="448" y="28" width="12" height="12" rx="0.8" fill="#cbd5e0" stroke="#718096" stroke-width="0.5"/>
  <circle cx="454" cy="34" r="1.5" fill="#2d3748"/>
  <line x1="463" y1="29" x2="469" y2="29" stroke="#718096" stroke-width="0.6"/>
  <line x1="463" y1="33" x2="469" y2="33" stroke="#718096" stroke-width="0.6"/>
  <line x1="463" y1="37" x2="469" y2="37" stroke="#718096" stroke-width="0.6"/>
  <!-- Wi-Fi 偶极子天线 -->
  <line x1="468" y1="25" x2="475" y2="17" stroke="#1a365d" stroke-width="0.8"/>
  <circle cx="475" cy="17" r="1.2" fill="#1a365d"/>

  <text x="458" y="51" font-size="6.0" font-weight="bold" fill="#2d3748" text-anchor="middle">Client 1</text>

  <!-- 本地训练自回环微弯圆弧 (步骤 ④) -->
  <g transform="translate(420, 30)">
    <path d="M 6 0 C 13 -6 13 6 5 5" fill="none" stroke="#718096" stroke-width="0.7" marker-end="url(#arr-gray)"/>
    <!-- 微型神经网络节点 -->
    <circle cx="-1" cy="-2" r="0.8" fill="#4a5568"/>
    <circle cx="-1" cy="4" r="0.8" fill="#4a5568"/>
    <circle cx="4" cy="1" r="0.8" fill="#2b6cb0"/>
    <line x1="-1" y1="-2" x2="4" y2="1" stroke="#718096" stroke-width="0.4"/>
    <line x1="-1" y1="4" x2="4" y2="1" stroke="#718096" stroke-width="0.4"/>
  </g>
</g>
<!-- 客户端节点 Client 2 -->
<g id="node-client2">
  <rect x="444" y="77" width="28" height="18" rx="1.5" fill="#f7fafc" stroke="#1a365d" stroke-width="0.8"/>
  <!-- 芯片与金手指接口 -->
  <rect x="448" y="80" width="12" height="12" rx="0.8" fill="#cbd5e0" stroke="#718096" stroke-width="0.5"/>
  <circle cx="454" cy="86" r="1.5" fill="#2d3748"/>
  <line x1="463" y1="81" x2="469" y2="81" stroke="#718096" stroke-width="0.6"/>
  <line x1="463" y1="85" x2="469" y2="85" stroke="#718096" stroke-width="0.6"/>
  <line x1="463" y1="89" x2="469" y2="89" stroke="#718096" stroke-width="0.6"/>
  <!-- Wi-Fi 偶极子天线 -->
  <line x1="468" y1="77" x2="475" y2="69" stroke="#1a365d" stroke-width="0.8"/>
  <circle cx="475" cy="69" r="1.2" fill="#1a365d"/>

  <text x="458" y="103" font-size="6.0" font-weight="bold" fill="#2d3748" text-anchor="middle">Client 2</text>

  <!-- 本地训练自回环微弯圆弧 (步骤 ④) -->
  <g transform="translate(420, 82)">
    <path d="M 6 0 C 13 -6 13 6 5 5" fill="none" stroke="#718096" stroke-width="0.7" marker-end="url(#arr-gray)"/>
    <!-- 微型神经网络节点 -->
    <circle cx="-1" cy="-2" r="0.8" fill="#4a5568"/>
    <circle cx="-1" cy="4" r="0.8" fill="#4a5568"/>
    <circle cx="4" cy="1" r="0.8" fill="#2b6cb0"/>
    <line x1="-1" y1="-2" x2="4" y2="1" stroke="#718096" stroke-width="0.4"/>
    <line x1="-1" y1="4" x2="4" y2="1" stroke="#718096" stroke-width="0.4"/>
  </g>
</g>
<!-- 客户端节点 Client 3 -->
<g id="node-client3">
  <rect x="444" y="129" width="28" height="18" rx="1.5" fill="#f7fafc" stroke="#1a365d" stroke-width="0.8"/>
  <!-- 芯片与金手指接口 -->
  <rect x="448" y="132" width="12" height="12" rx="0.8" fill="#cbd5e0" stroke="#718096" stroke-width="0.5"/>
  <circle cx="454" cy="138" r="1.5" fill="#2d3748"/>
  <line x1="463" y1="133" x2="469" y2="133" stroke="#718096" stroke-width="0.6"/>
  <line x1="463" y1="137" x2="469" y2="137" stroke="#718096" stroke-width="0.6"/>
  <line x1="463" y1="141" x2="469" y2="141" stroke="#718096" stroke-width="0.6"/>
  <!-- Wi-Fi 偶极子天线 -->
  <line x1="468" y1="129" x2="475" y2="121" stroke="#1a365d" stroke-width="0.8"/>
  <circle cx="475" cy="121" r="1.2" fill="#1a365d"/>

  <text x="458" y="155" font-size="6.0" font-weight="bold" fill="#2d3748" text-anchor="middle">Client 3</text>

  <!-- 本地训练自回环微弯圆弧 (步骤 ④) -->
  <g transform="translate(420, 134)">
    <path d="M 6 0 C 13 -6 13 6 5 5" fill="none" stroke="#718096" stroke-width="0.7" marker-end="url(#arr-gray)"/>
    <!-- 微型神经网络节点 -->
    <circle cx="-1" cy="-2" r="0.8" fill="#4a5568"/>
    <circle cx="-1" cy="4" r="0.8" fill="#4a5568"/>
    <circle cx="4" cy="1" r="0.8" fill="#2b6cb0"/>
    <line x1="-1" y1="-2" x2="4" y2="1" stroke="#718096" stroke-width="0.4"/>
    <line x1="-1" y1="4" x2="4" y2="1" stroke="#718096" stroke-width="0.4"/>
  </g>
</g>
<text x="408" y="16" font-size="5.2" font-weight="bold" fill="#4a5568" text-anchor="end">④ 本地训练 (ResNet-18)</text>
<!-- 客户端省略号与 Client N -->
<g id="clients-more">
  <circle cx="458" cy="169" r="1.1" fill="#718096"/>
  <circle cx="458" cy="174" r="1.1" fill="#718096"/>
  <circle cx="458" cy="179" r="1.1" fill="#718096"/>
  
  <!-- Client N 简练外框 -->
  <rect x="444" y="186" width="28" height="15" rx="1.5" fill="#f7fafc" stroke="#718096" stroke-width="0.7" stroke-dasharray="2,1"/>
  <text x="458" y="196" font-size="5.5" font-weight="bold" fill="#4a5568" text-anchor="middle">Client ··· N</text>
  <line x1="468" y1="186" x2="474" y2="180" stroke="#718096" stroke-width="0.7"/>
  <circle cx="474" cy="180" r="1" fill="#718096"/>
</g>
<!-- 下行广播发射弧 -->
<g id="downlink-transmit-arc">
  <path d="M 137 105 C 137 72 165 42 190 38" fill="none" stroke="#2b6cb0" stroke-width="1.2" marker-end="url(#arr-blue)"/>
</g>
<!-- 无线辐射波浪 -->
<g id="rf-waves">
  <!-- 弧浪 1 -->
  <path d="M 215 16 A 55 55 0 0 1 228 75" fill="none" stroke="#2b6cb0" stroke-width="0.9" stroke-opacity="0.4"/>
  <!-- 弧浪 2 -->
  <path d="M 245 8 A 85 85 0 0 1 268 95" fill="none" stroke="#2b6cb0" stroke-width="1.1" stroke-opacity="0.6"/>
  <!-- 弧浪 3 (波前外缘) -->
  <path d="M 285 2 A 125 125 0 0 1 315 115" fill="none" stroke="#2b6cb0" stroke-width="1.3" stroke-opacity="0.8"/>
  <!-- 弧浪 4 -->
  <path d="M 320 0 A 160 160 0 0 1 348 130" fill="none" stroke="#2b6cb0" stroke-width="0.9" stroke-opacity="0.3" stroke-dasharray="4,2"/>
</g>
<!-- 步骤 ② 标牌 -->
<g id="step-2-label">
  <rect x="200" y="12" width="138" height="15" rx="2" fill="#ffffff" stroke="#2b6cb0" stroke-width="0.7"/>
  <circle cx="208" cy="19.5" r="3.8" fill="#1a365d"/>
  <text x="208" y="21.7" font-size="5.2" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="274" y="22" font-size="5.8" font-weight="bold" fill="#2b6cb0" text-anchor="middle">② 模型下行广播 (UFTP / 40 MiB)</text>
</g>
<!-- 接入各客户端的平滑短弧 -->
<g id="downlink-arrival-arcs">
  <!-- 接入 Client 1 天线 (475, 17) -->
  <path d="M 330 36 C 370 26 420 18 471 17" fill="none" stroke="#2b6cb0" stroke-width="1.1" marker-end="url(#arr-blue)"/>
  
  <!-- 接入 Client 2 天线 (475, 69) -->
  <path d="M 325 58 C 370 60 420 68 471 69" fill="none" stroke="#2b6cb0" stroke-width="1.1" marker-end="url(#arr-blue)"/>

  <!-- 接入 Client 3 天线 (475, 121) -->
  <path d="M 310 88 C 355 102 415 118 471 121" fill="none" stroke="#2b6cb0" stroke-width="1.1" marker-end="url(#arr-blue)"/>
</g>
<!-- 步骤 ③ 解耦指示 -->
<g id="step-3-decouple">
  <rect x="315" y="52" width="90" height="15" rx="2" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="0.6"/>
  <circle cx="323" cy="59.5" r="3.5" fill="#1a365d"/>
  <text x="323" y="61.5" font-size="5.0" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="366" y="61.7" font-size="5.2" font-weight="bold" fill="#2b6cb0" text-anchor="middle">③ 校验解耦即刻训练</text>
  <!-- 指向 Client 1 短弯弧 -->
  <path d="M 405 59 C 420 59 430 46 441 38" fill="none" stroke="#2b6cb0" stroke-width="0.7" marker-end="url(#arr-blue)"/>
</g>
<!-- 上行客户端汇出弧 -->
<g id="uplink-gather-arcs">
  <path d="M 444 38 C 428 42 415 65 405 115" fill="none" stroke="#2b6cb0" stroke-width="0.8"/>
  <path d="M 444 92 C 428 96 415 110 405 125" fill="none" stroke="#2b6cb0" stroke-width="0.8"/>
  <path d="M 444 144 C 428 148 418 152 405 156" fill="none" stroke="#2b6cb0" stroke-width="0.8"/>
</g>
<!-- 主上行平滑波浪曲线 -->
<g id="step-5-uplink">
  <path d="M 405 156 C 335 168 250 140 160 148" fill="none" stroke="#2b6cb0" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  
  <!-- 步骤 ⑤ 紧凑标牌 -->
  <rect x="230" y="138" width="138" height="15" rx="2" fill="#ffffff" stroke="#2b6cb0" stroke-width="0.7"/>
  <circle cx="238" cy="145.5" r="3.8" fill="#1a365d"/>
  <text x="238" y="147.7" font-size="5.2" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="302" y="148" font-size="5.8" font-weight="bold" fill="#2b6cb0" text-anchor="middle">⑤ 轮转上行 (HTTP PUT / TCP)</text>

  <!-- 反向 TCP ACK 辅助流平滑微弯虚线 -->
  <path d="M 160 158 C 240 152 320 180 395 170" fill="none" stroke="#718096" stroke-width="0.7" stroke-dasharray="2.5,1.5" marker-end="url(#arr-gray)"/>
  <text x="278" y="172" font-size="5.0" fill="#718096" text-anchor="middle">服务端反向 TCP ACK (维持流控)</text>
</g>
</svg>
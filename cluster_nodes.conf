# ==============================================================================
# WFB-FL ARMv8 多板载集群全局配置文件 (cluster_nodes.conf)
# ==============================================================================
# 本配置文件定义无线空口射频参数、服务端拓扑以及客户端集群节点列表。
# 操作者可根据现场路由器 DHCP 分配的以太网 IP 和实际射频环境修改本文件。

# ------------------------------------------------------------------------------
# 1. 无线射频与空口链路参数 (Wireless Radio & Link Parameters)
# ------------------------------------------------------------------------------
# 5GHz 射频信道:
#   合法信道示例: 149, 153, 157, 165 等常用 5GHz 频点
#   硬性安全黑名单: 严禁配置 161！
#   (注: RTL8812AU 驱动内核缺失 163 频点定义，配置 161 将触发 UBSAN 越界崩溃导致网卡瘫痪)
WIRELESS_CHANNEL=157

# 信道频宽:
#   默认推荐 HT40+ (40MHz 带宽，向高频聚合)，可选 HT20, HT40+, HT40-
WIRELESS_CHANNEL_WIDTH=HT40+

# 物理发射功率 (单位: dBm):
#   合法范围: 10 ~ 20 dBm
#   台面近距测试建议: 默认推荐 12 dBm (距离 < 2 米时切勿超过 15 dBm，防止接收端 LNA 深度饱和)
WIRELESS_TXPOWER_DBM=12

# 下行组播调制编码策略 (Downlink MCS):
#   合法范围: 3 ~ 6，默认推荐 3 (16-QAM 1/2)
DOWNLINK_MCS=3

# 上行单播调度调制编码策略 (Uplink MCS):
#   合法范围: 3 ~ 6，默认推荐 6 (64-QAM 3/4)
UPLINK_MCS=6

# 下行 UFTP 组播发送注入速率 (单位: Kbps):
#   默认推荐 15000 Kbps (15 Mbps)
#   UFTP 速率必须与 DOWNLINK_MCS 物理容量严格匹配，各 MCS 允许安全区间如下:
#     MCS 3: 12000 ~ 18000 Kbps (推荐默认 15000)
#     MCS 4: 18000 ~ 26000 Kbps (推荐默认 22000)
#     MCS 5: 24000 ~ 35000 Kbps (推荐默认 28000)
#     MCS 6: 32000 ~ 45000 Kbps (推荐默认 38000)
UFTP_RATE_KBPS=15000

# ------------------------------------------------------------------------------
# 2. 服务端节点配置 (Server Node Specification)
# ------------------------------------------------------------------------------
SERVER_NODE_ID=255
SERVER_TUN_IP=10.80.0.1/24

# 服务端管理网 IP 与 SSH 登录用户 (用于电脑端 sync_to_server.ps1 脚本一键推送，可选):
SERVER_HOST=192.168.1.100
SERVER_USER=ubuntu

# ------------------------------------------------------------------------------
# 3. 客户端节点拓扑列表 (Client Nodes Topology)
# 每行声明一个 Client 节点，字段格式如下:
#   role_name  host_ip        ssh_user  node_id  tun_ip
#
# 字段说明:
#   role_name: 角色标识 (如 client1, client2 等)
#   host_ip:   局域网管理网 IP (路由器 DHCP 动态分配的真实以太网/Wi-Fi IP)
#   ssh_user:  该板子的 SSH 登录用户名 (如 ubuntu, debian 等)
#   node_id:   底座节点 ID (整数 1 ~ 254，不可重复，不可为 255)
#   tun_ip:    WFB 空口虚拟网卡 TUN IP (如 10.80.0.11，不可与 Server 冲突)
# ------------------------------------------------------------------------------
CLIENTS=(
    "client1 192.168.1.101 ubuntu 1 10.80.0.11"
    "client2 192.168.1.102 ubuntu 2 10.80.0.12"
    "client3 192.168.1.103 ubuntu 3 10.80.0.13"
    "client4 192.168.1.104 ubuntu 4 10.80.0.14"
    "client5 192.168.1.105 ubuntu 5 10.80.0.15"
    "client6 192.168.1.106 ubuntu 6 10.80.0.16"
    "client7 192.168.1.107 ubuntu 7 10.80.0.17"
)
